<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Transparent overlay fixture</title>
    <style>
      #overlay {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        opacity: 0.01;
        background: transparent;
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <button id="play">Play video</button>
    </main>
    <iframe id="overlay" src="https://doubleclick.net/popup-frame" title=""></iframe>
  </body>
</html>
