<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Legitimate link gestures</title>

    <a id="same-tab" href="/watch">Watch in this tab</a>
    <a id="new-tab" href="/watch" target="_blank" rel="noopener">Watch in a new tab</a>
