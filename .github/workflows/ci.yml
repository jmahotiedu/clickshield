name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Update lockfile and normalize batch
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-dev --save-exact @playwright/test@1.61.1
          npm exec prettier -- --write \
            package.json \
            playwright.config.ts \
            filters/declarative/base.json \
            src/background/session-state.ts \
            src/background/tab-guardian.ts \
            src/content/content-script.ts \
            src/content/overlay-mitigator.ts \
            src/popup/diagnostics.ts \
            src/popup/popup.html \
            src/popup/popup.css \
            src/popup/popup.ts \
            tests/unit/overlay-mitigator.test.ts \
            tests/unit/diagnostics-view-model.test.ts \
            tests/unit/session-state.test.ts \
            tests/fixtures/server.ts \
            tests/e2e/fixtures/extension-context.ts \
            tests/e2e/site-toggle.spec.ts \
            tests/e2e/network-blocking.spec.ts \
            tests/e2e/popup-protection.spec.ts \
            tests/e2e/overlay-protection.spec.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json playwright.config.ts filters/declarative/base.json src tests
          if ! git diff --cached --quiet; then
            git commit -m "style: format overlay diagnostics and browser tests"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - run: npm ci
      - run: npm run verify
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
