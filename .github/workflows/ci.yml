name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - name: Normalize guardian session and overlay files
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          npm exec prettier -- --write src/background/session-state.ts src/background/service-worker.ts src/main-world/event-bridge.ts src/main-world/popup-guard.ts src/content/content-script.ts src/content/overlay-detector.ts src/shared/messages.ts tests/unit/session-state.test.ts tests/unit/popup-guard.test.ts tests/unit/shared-contracts.test.ts tests/unit/overlay-detector.test.ts tests/fixtures/transparent-overlay.html tests/fixtures/legitimate-dialogs.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/background/session-state.ts src/background/service-worker.ts src/main-world/event-bridge.ts src/main-world/popup-guard.ts src/content/content-script.ts src/content/overlay-detector.ts src/shared/messages.ts tests/unit/session-state.test.ts tests/unit/popup-guard.test.ts tests/unit/shared-contracts.test.ts tests/unit/overlay-detector.test.ts tests/fixtures/transparent-overlay.html tests/fixtures/legitimate-dialogs.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format guardian session and overlay files"
          git push origin HEAD:${{ github.ref_name }}
      - run: npm run verify
