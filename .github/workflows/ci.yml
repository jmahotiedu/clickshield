name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Bootstrap planned foundation
        id: bootstrap
        if: ${{ github.event_name == 'push' && hashFiles('tools/bootstrap-foundation.mjs') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          node tools/bootstrap-foundation.mjs 1
          npm install --package-lock-only --ignore-scripts
          git add \
            package.json package-lock.json tsconfig.json eslint.config.js \
            .prettierrc.json .gitignore vitest.config.ts \
            src/shared/.gitkeep src/shared/project.ts \
            tests/unit/project-smoke.test.ts
          git commit -m "chore: initialize TypeScript extension workspace"

          node tools/bootstrap-foundation.mjs 2
          git add \
            manifest.json tools/build-extension.ts tools/validate-manifest.ts \
            tests/unit/manifest-validation.test.ts \
            src/background/service-worker.ts src/content/content-script.ts \
            src/main-world/popup-guard.ts src/popup/popup.html \
            src/popup/popup.ts src/popup/popup.css
          git commit -m "build: add deterministic extension packaging"

          node tools/bootstrap-foundation.mjs 3
          git add \
            src/shared/messages.ts src/shared/decisions.ts \
            src/shared/settings.ts src/shared/types.ts \
            tests/unit/shared-contracts.test.ts
          git commit -m "feat: define extension message contracts"

          git rm tools/bootstrap-foundation.mjs
          git commit -m "chore: remove foundation bootstrap helper"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Verify foundation
        run: npm run verify

      - name: Push verified bootstrap commits
        if: ${{ steps.bootstrap.outputs.changed == 'true' }}
        shell: bash
        run: git push origin HEAD:${{ github.ref_name }}
