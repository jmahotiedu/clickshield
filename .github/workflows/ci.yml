name: CI

on:
  push:

permissions:
  contents: write

jobs:
  format-final-task-files:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - name: Format Task 19 and 20 files
        run: |
          npm exec prettier -- --write \
            package.json \
            README.md \
            docs/permissions.md \
            docs/privacy.md \
            docs/filter-sources.md \
            docs/testing.md \
            tools/check-dist.ts \
            tests/unit/dist-validation.test.ts
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add package.json README.md docs tools/check-dist.ts tests/unit/dist-validation.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format artifact validation and documentation"
            git push origin HEAD:${{ github.ref_name }}
          fi
